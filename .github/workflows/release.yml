name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Standalone Executable
        run: |
          python build.py

      - name: Calculate SHA-256 Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Path "dist/LivelyWallpaperShuffler.exe" -Algorithm SHA256).Hash
          "$hash  LivelyWallpaperShuffler.exe" | Out-File -Encoding utf8 "dist/checksums.txt"
          Write-Host "Generated SHA-256: $hash"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/LivelyWallpaperShuffler.exe
            dist/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
